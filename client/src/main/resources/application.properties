quarkus.application.name=transport-admin
quarkus.http.port=8081
quarkus.http.root-path=/transit

# API transport (backend Quarkus)
quarkus.rest-client.transport-api.url=${TRANSPORT_API_URL:http://localhost:8080/api}
quarkus.rest-client.transport-api.connect-timeout=3000
quarkus.rest-client.transport-api.read-timeout=10000

# JSF / PrimeFaces
quarkus.myfaces.project-stage=Development

# ---------- Keycloak : connexion de l'administrateur ----------
# Client public "transport" (realm transit), flux Authorization Code + PKCE.
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8230/auth/realms/transit}
quarkus.oidc.client-id=transport
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Keycloak place realm_access dans le jeton d acces, pas dans le jeton d identite
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.scopes=openid,profile
quarkus.oidc.token-state-manager.encryption-secret=${OIDC_STATE_SECRET:transit-admin-dev-secret-change-me-32chars}
quarkus.oidc.logout.path=/transit/logout
quarkus.oidc.logout.post-logout-path=/transit/index.xhtml

# Toutes les pages exigent une session connectee
quarkus.http.auth.permission.pages.paths=/*
quarkus.http.auth.permission.pages.policy=authenticated
