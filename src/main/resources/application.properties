# ============================================================
# transport-server-impl-quarkus
# ============================================================
quarkus.application.name=transport-server
quarkus.http.port=8080
quarkus.http.root-path=/api

# ---------- PostgreSQL ----------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:transit}
quarkus.datasource.password=${DB_PASSWORD:transit}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/transit}
quarkus.datasource.jdbc.max-size=16

# Le schema est gere par Flyway, jamais par Hibernate.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# ---------- Configuration metier ----------
transit.system.transport.alert-threshold-days=30

# ---------- Securite : Keycloak (branche en fin de parcours) ----------
quarkus.oidc.enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180/realms/transit}
quarkus.oidc.client-id=transport-server
quarkus.oidc.application-type=service
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# ---------- Client REST ----------
quarkus.rest-client.transport-uri.url=${TRANSPORT_URI:http://localhost:8080/api}

# ---------- CORS ----------
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# ---------- Swagger UI / OpenAPI ----------
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=Transport Server - Documentation
quarkus.swagger-ui.doc-expansion=list
quarkus.swagger-ui.try-it-out-enabled=true
quarkus.swagger-ui.display-request-duration=true

mp.openapi.extensions.smallrye.info.title=Transport Server API
mp.openapi.extensions.smallrye.info.version=0.0.0-SNAPSHOT
mp.openapi.extensions.smallrye.info.description=Gestion de transport par abonnement - Referentiel flotte

quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth

# ---------- Dev : ni Keycloak ni token requis ----------
%dev.quarkus.oidc.enabled=false
%dev.quarkus.security.jaxrs.deny-unannotated-endpoints=false
%dev.quarkus.log.category."ci.transit".level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true

# ---------- Test ----------
%test.quarkus.oidc.enabled=false
%test.quarkus.flyway.clean-at-start=true
